services:
  postgres:
    image: postgres:16-alpine
    container_name: architect-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-architect-ai-db}
      POSTGRES_USER: ${POSTGRES_USER:-architect-ai-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-architect-ai-password}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-architect-ai-user} -d ${POSTGRES_DB:-architect-ai-db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: architect-ai-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: architect-ai-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_HTTP_PORT:-6335}:6333'
      - '${QDRANT_GRPC_PORT:-6336}:6334'
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: architect-ai-api
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-5000}
      # Prefer DOCKER_DATABASE_URL so host-oriented DATABASE_URL (localhost:5433) is not injected into containers.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://architect-ai-user:architect-ai-password@postgres:5432/architect-ai-db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-architect_chunks}
      INDEXING_WORKER_ENABLED: 'false'
      INDEXING_WORKER_CONCURRENCY: ${INDEXING_WORKER_CONCURRENCY:-2}
      INDEXING_TMP_DIR: ${INDEXING_TMP_DIR:-/tmp/architect-ai/indexing}
      INDEXING_TMP_STALE_MINUTES: ${INDEXING_TMP_STALE_MINUTES:-120}
      INDEXING_MAX_CLONE_BYTES: ${INDEXING_MAX_CLONE_BYTES:-1000000000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Architect AI <onboarding@resend.dev>}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-sales@architect.ai}
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHFILE: UsePollingInterval
    ports:
      - '${API_PORT:-5000}:5000'
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      # node:20-alpine has no wget; match production and probe with Node fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  indexing-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: architect-ai-indexing-worker
    restart: unless-stopped
    working_dir: /workspace
    command: pnpm --filter api dev:worker
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://architect-ai-user:architect-ai-password@postgres:5432/architect-ai-db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-architect_chunks}
      INDEXING_WORKER_ENABLED: 'true'
      INDEXING_WORKER_CONCURRENCY: ${INDEXING_WORKER_CONCURRENCY:-2}
      INDEXING_TMP_DIR: ${INDEXING_TMP_DIR:-/tmp/architect-ai/indexing}
      INDEXING_TMP_STALE_MINUTES: ${INDEXING_TMP_STALE_MINUTES:-120}
      INDEXING_MAX_CLONE_BYTES: ${INDEXING_MAX_CLONE_BYTES:-1000000000}
      INDEXING_CLONE_TIMEOUT_MS: ${INDEXING_CLONE_TIMEOUT_MS:-120000}
      INDEXING_JOB_LOCK_DURATION_MS: ${INDEXING_JOB_LOCK_DURATION_MS:-1800000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_STATE_SECRET: ${GITHUB_OAUTH_STATE_SECRET:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PORT: ${API_PORT:-5000}
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: architect-ai-web
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NODE_ENV: development
      WEB_PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
      CREATOR_SITE_URL: ${CREATOR_SITE_URL:-}
      CREATOR_LINKEDIN_URL: ${CREATOR_LINKEDIN_URL:-}
      CREATOR_EMAIL_URL: ${CREATOR_EMAIL_URL:-}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  pnpm-store:
  api-node-modules:
  web-node-modules:
