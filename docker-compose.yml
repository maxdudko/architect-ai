services:
  postgres:
    image: postgres:16-alpine
    container_name: architectai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-architectai}
      POSTGRES_USER: ${POSTGRES_USER:-architectai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-architectai}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-architectai} -d ${POSTGRES_DB:-architectai}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: architectai-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: architectai-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_HTTP_PORT:-6335}:6333'
      - '${QDRANT_GRPC_PORT:-6336}:6334'
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: architectai-api
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://architectai:architectai@postgres:5432/architectai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - '${API_PORT:-5000}:5000'
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: architectai-web
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NODE_ENV: development
      WEB_PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  pnpm-store:
