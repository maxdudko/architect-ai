name: architect-ai-prod

x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: architect-ai-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *app-logging
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    container_name: architect-ai-prod-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *app-logging
    mem_limit: 256m

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: architect-ai-prod-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    logging: *app-logging
    mem_limit: 1g

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile.prod
    container_name: architect-ai-prod-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      RUN_MIGRATIONS: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-architect_chunks}
      INDEXING_WORKER_ENABLED: 'false'
      INDEXING_TMP_DIR: ${INDEXING_TMP_DIR:-/tmp/architect-ai/indexing}
    expose:
      - '5000'
    volumes:
      - indexing-tmp:/tmp/architect-ai/indexing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *app-logging
    mem_limit: 768m

  indexing-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile.prod
    container_name: architect-ai-prod-indexing-worker
    restart: unless-stopped
    command: ['node', 'dist/indexing-worker']
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: 'false'
      INDEXING_WORKER_ENABLED: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-architect_chunks}
      INDEXING_TMP_DIR: ${INDEXING_TMP_DIR:-/tmp/architect-ai/indexing}
    volumes:
      - indexing-tmp:/tmp/architect-ai/indexing
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      api:
        condition: service_healthy
    logging: *app-logging
    mem_limit: 1536m

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: architect-ai-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *app-logging
    mem_limit: 512m

  caddy:
    image: caddy:2.9-alpine
    container_name: architect-ai-prod-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *app-logging
    mem_limit: 64m

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  indexing-tmp:
  caddy-data:
  caddy-config:
